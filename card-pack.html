<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Covet — Card pack</title>
  <!--
    Placeholder pack for the Covet site. No build step.
    Each card is 2.75in wide by 4.75in tall (aspect 2.75 / 4.75).
    The box scales down only so the fan fits the window.
    Drop a photo in by adding <img class="face" src="..." alt=""> as the
    first child of a .card. The number stays until you remove it.
  -->
  <style>
    :root {
      --ink: #14110e;
      --tide: #0c1418;
      --pearl: #f6f1e8;
      --gold: #EBCB3F;
      --serif: Didot, "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
      --sans: "Avenir Next", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background:
        radial-gradient(ellipse at 50% 18%, rgba(235, 203, 63, 0.16), transparent 42%),
        radial-gradient(ellipse at 50% 120%, rgba(20, 40, 48, 0.9), transparent 46%),
        var(--tide);
      color: var(--pearl);
      font-family: var(--sans);
      font-weight: 400;
    }

    .scene {
      min-height: 100vh;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: clamp(1rem, 3vh, 1.8rem);
      padding: clamp(1.4rem, 4vh, 3rem) 4vw clamp(2rem, 6vh, 3.5rem);
    }

    .intro { text-align: center; }

    .kicker {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold);
    }

    h1 {
      margin: 0.35rem 0 0;
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 3.1rem);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .size {
      margin: 0.35rem 0 0;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(246, 241, 232, 0.62);
    }

    .pack {
      --n: 24;
      --mid: 11.5;
      --card-w: min(2.2in, 12.5vw, calc(46vh * 2.75 / 4.75));
      --spread: calc(var(--card-w) * 4 / (var(--n) - 1));
      --spread-wide: calc(var(--card-w) * 8.5 / (var(--n) - 1));
      --fan: calc(32deg / (var(--n) - 1));
      --fan-wide: calc(46deg / (var(--n) - 1));
      --drop: 5px;
      position: relative;
      margin-top: 1.6rem;
      width: var(--card-w);
      height: calc(var(--card-w) * 4.75 / 2.75);
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .pack:focus-visible {
      outline: 1px solid rgba(235, 203, 63, 0.85);
      outline-offset: 10px;
    }

    .shadow {
      position: absolute;
      z-index: 0;
      left: 50%;
      bottom: 1%;
      width: 76%;
      height: 16px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.5), transparent 70%);
      filter: blur(7px);
      pointer-events: none;
      transition: width 0.7s ease, opacity 0.7s ease;
    }

    .pack.is-splayed .shadow { width: 240%; }
    .pack.is-spread .shadow { width: 320%; opacity: 0.85; }

    .card {
      position: absolute;
      z-index: calc(var(--i) + 1);
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 0.3rem;
      padding:
        calc(var(--card-w) * 0.09)
        calc(var(--card-w) * 0.06)
        calc(var(--card-w) * 0.06)
        calc(var(--card-w) * 0.08);
      border-radius: 0.7rem;
      overflow: visible;
      background: linear-gradient(168deg, var(--c1), var(--c2) 58%, var(--c3));
      color: var(--ink);
      box-shadow:
        0 16px 28px rgba(0, 0, 0, 0.32),
        inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      transform:
        translateX(var(--nudge))
        translateY(calc((var(--i) - var(--mid)) * -2px))
        rotate(var(--jitter))
        scale(1);
      transform-origin: 50% 60%;
      perspective: 1200px;
      transition:
        transform 0.82s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.45s ease;
      transition-delay: calc(abs(var(--i) - var(--mid)) * 34ms);
      user-select: none;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0.5rem;
      border: 1px solid color-mix(in srgb, var(--ink) 38%, transparent);
      border-radius: 0.4rem;
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.16) 46%, transparent 58%);
      pointer-events: none;
    }

    .card .backing {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #2a2623;
      border-radius: inherit;
    }

    .card .face {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }

    .card:has(.face) {
      background: #2a2623;
      border-radius: 7.16% / 4.15%;
      box-shadow:
        0 0 0 1px rgba(176, 98, 52, 0.95),
        0 0 7px 1px rgba(206, 132, 74, 0.55),
        0 16px 28px rgba(0, 0, 0, 0.32);
    }

    .card:has(.face)::before {
      display: block;
      inset: 0;
      border: 1px solid rgba(236, 190, 142, 0.8);
      border-radius: inherit;
      z-index: 2;
    }

    .card:has(.face)::after {
      display: none;
    }

    .turn {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pack.is-flipped .turn { transform: rotateY(180deg); }

    .front,
    .back {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .back { transform: rotateY(180deg); }

    .front::before,
    .back::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border: 1px solid rgba(236, 190, 142, 0.8);
      border-radius: inherit;
      pointer-events: none;
    }

    .card:has(.turn)::before,
    .card:has(.turn)::after { display: none; }

    .flip-btn {
      appearance: none;
      border: 1px solid rgba(235, 203, 63, 0.7);
      background: transparent;
      color: var(--pearl);
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.55rem 1.05rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .flip-btn:hover,
    .flip-btn:focus-visible {
      border-color: var(--gold);
      color: var(--gold);
      outline: none;
    }

    .index {
      font-family: var(--serif);
      font-size: calc(var(--card-w) * 0.23);
      font-weight: 400;
      line-height: 0.8;
      letter-spacing: 0.02em;
    }

    .name {
      font-size: calc(var(--card-w) * 0.052);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .pack.is-splayed .card {
      transform:
        translateX(calc((var(--i) - var(--mid)) * var(--spread)))
        translateY(calc(abs(var(--i) - var(--mid)) * var(--drop)))
        rotate(calc((var(--i) - var(--mid)) * var(--fan)))
        scale(1);
      transition-delay: calc(abs(var(--i) - var(--mid)) * 58ms + var(--lag));
    }

    .pack.is-splayed.is-spread .card {
      transform:
        translateX(calc((var(--i) - var(--mid)) * var(--spread-wide)))
        translateY(calc(abs(var(--i) - var(--mid)) * var(--drop) + 4px))
        rotate(calc((var(--i) - var(--mid)) * var(--fan-wide)))
        scale(1);
      transition-duration: 0.55s;
      transition-delay: calc(abs(var(--i) - var(--mid)) * 24ms);
    }

    .pack.is-splayed.is-spread .card.is-hot {
      z-index: 40;
      transform:
        translateX(0)
        translateY(-5vh)
        rotate(0deg)
        scale(2);
      box-shadow:
        0 0 0 1px rgba(214, 150, 96, 1),
        0 0 12px 2px rgba(220, 148, 86, 0.7),
        0 24px 36px rgba(0, 0, 0, 0.42);
      transition-duration: 0.42s;
      transition-delay: 0ms;
    }

    .hint {
      margin: 0;
      max-width: 28rem;
      text-align: center;
      font-size: 0.92rem;
      line-height: 1.45;
      color: rgba(246, 241, 232, 0.78);
    }

    .for-tap { display: none; }

    @media (hover: none), (pointer: coarse) {
      .for-hover { display: none; }
      .for-tap { display: inline; }
    }

    @media (max-width: 800px) {
      .pack {
        --card-w: min(1.5in, 15vw, calc(34vh * 2.75 / 4.75));
        --spread: calc(var(--card-w) * 3.2 / (var(--n) - 1));
        --spread-wide: calc(var(--card-w) * 6.2 / (var(--n) - 1));
        --fan: calc(26deg / (var(--n) - 1));
        --fan-wide: calc(36deg / (var(--n) - 1));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .shadow, .turn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <header class="intro">
      <p class="kicker">Covet</p>
      <h1>Pack study</h1>
      <p class="size">2.75″ wide × 4.75″ tall</p>
    </header>

    <p class="hint">
      <span class="for-hover">Hover the pack to fan it. Hover a card to bring it forward.</span>
      <span class="for-tap">Tap the pack to fan the cards. Tap again to close it.</span>
    </p>

    <button class="flip-btn" id="flip" type="button" aria-pressed="false">Show the backs</button>

    <div class="pack" id="pack" role="button" tabindex="0" aria-expanded="false" aria-label="Card pack"></div>
  </main>

  <script>
    (function () {
      var RANKS = ["2", "3", "4", "5", "6", "7", "8", "9", "10", "jack", "king", "ace", "queen"];
      var SUITS = ["clubs", "diamonds", "spades", "hearts"];
      var RANK_NAME = {
        "2": "Two", "3": "Three", "4": "Four", "5": "Five", "6": "Six", "7": "Seven", "8": "Eight",
        "9": "Nine", "10": "Ten", jack: "Jack", queen: "Queen", king: "King", ace: "Ace"
      };
      var pack = document.getElementById("pack");
      var deck = [];
      function addCard(file, name, red) {
        deck.push({
          src: "/images/cards/sm/" + file + ".webp?v=8",
          full: "/images/cards/lg/" + file + ".webp?v=8",
          back: "/images/cards/lg/back-" + (red ? "red" : "blue") + ".webp?v=8",
          backName: red ? "Red card back" : "Blue card back",
          name: name
        });
      }
      RANKS.forEach(function (rank) {
        SUITS.forEach(function (suit) {
          var red = suit === "hearts" || suit === "diamonds";
          addCard(rank + "-of-" + suit, RANK_NAME[rank] + " of " + suit.charAt(0).toUpperCase() + suit.slice(1), red);
        });
      });
      addCard("joker-teal", "Teal joker", false);
      addCard("joker-copper", "Copper joker", true);
      pack.style.setProperty("--n", deck.length);
      pack.style.setProperty("--mid", (deck.length - 1) / 2);
      pack.setAttribute("aria-label", "Card pack of " + deck.length + " cards");
      pack.innerHTML = '<span class="shadow" aria-hidden="true"></span>' + deck.map(function (card, i) {
        var jitter = (((i * 17) % 7) - 3) * 0.55;
        var nudge = (((i * 13) % 5) - 2) * 2;
        var lag = (i * 19) % 46;
        return '<article class="card" style="--i:' + i + ';--lag:' + lag + 'ms;--nudge:' + nudge + 'px;--jitter:' + jitter.toFixed(2) + 'deg">' +
          '<div class="turn">' +
            '<div class="front">' +
              '<span class="backing" aria-hidden="true"></span>' +
              '<img class="face" src="' + card.src + '" data-full="' + card.full + '" alt="' + card.name + '" decoding="async">' +
            '</div>' +
            '<div class="back">' +
              '<span class="backing" aria-hidden="true"></span>' +
              '<img class="face" src="' + card.back + '" alt="' + card.backName + '" decoding="async">' +
            '</div>' +
          '</div>' +
          '</article>';
      }).join("");
      var cards = Array.prototype.slice.call(pack.querySelectorAll(".card"));
      var flip = document.getElementById("flip");
      flip.addEventListener("click", function () {
        var showingBacks = !pack.classList.contains("is-flipped");
        pack.classList.toggle("is-flipped", showingBacks);
        flip.setAttribute("aria-pressed", String(showingBacks));
        flip.textContent = showingBacks ? "Show the faces" : "Show the backs";
      });
      var fine = window.matchMedia("(hover: hover) and (pointer: fine)");
      var anchor = null;
      var hot = null;
      var pinned = false;
      var last = { x: 0, y: 0 };

      function cardAt(x, y) {
        var el = document.elementFromPoint(x, y);
        if (!el || !el.closest) return null;
        var card = el.closest(".card");
        return card && pack.contains(card) ? card : null;
      }

      function nearCards(x, y, margin) {
        for (var i = 0; i < cards.length; i++) {
          var r = cards[i].getBoundingClientRect();
          if (x >= r.left - margin && x <= r.right + margin && y >= r.top - margin && y <= r.bottom + margin) {
            return true;
          }
        }
        return false;
      }

      function sharpen(card) {
        var img = card.querySelector(".face");
        if (!img || img.dataset.ready === "1") return;
        var full = img.getAttribute("data-full");
        if (!full || img.dataset.loading === "1") return;
        img.dataset.loading = "1";
        var pre = new Image();
        pre.onload = function () {
          img.src = full;
          img.dataset.ready = "1";
        };
        pre.src = full;
      }

      function setHot(card) {
        if (!card) return;
        hot = card;
        sharpen(card);
        pack.classList.add("is-spread");
        cards.forEach(function (c) { c.classList.toggle("is-hot", c === card); });
      }

      function clearSpread() {
        hot = null;
        pack.classList.remove("is-spread");
        cards.forEach(function (c) { c.classList.remove("is-hot"); });
      }

      function closeFan() {
        anchor = null;
        clearSpread();
        pack.classList.remove("is-splayed");
        pack.setAttribute("aria-expanded", "false");
      }

      pack.addEventListener("pointerenter", function (e) {
        if (!fine.matches || pinned || e.pointerType === "touch") return;
        last.x = e.clientX;
        last.y = e.clientY;
        if (pack.classList.contains("is-splayed")) return;
        pack.classList.add("is-splayed");
        pack.setAttribute("aria-expanded", "true");
        anchor = { x: e.clientX, y: e.clientY, card: cardAt(e.clientX, e.clientY), t: performance.now() };
      });

      window.addEventListener("pointermove", function (e) {
        last.x = e.clientX;
        last.y = e.clientY;
        if (!fine.matches || !pack.classList.contains("is-splayed") || !anchor) return;
        if (e.target instanceof Element && flip.contains(e.target)) return;
        var card = cardAt(e.clientX, e.clientY);
        var dist = Math.hypot(e.clientX - anchor.x, e.clientY - anchor.y);
        var left = !card && !nearCards(e.clientX, e.clientY, 64);
        if (left && !pinned) {
          closeFan();
          return;
        }
        if (card) sharpen(card);
        if (dist < 16 || performance.now() - anchor.t < 320) return;
        if (card && card !== hot) setHot(card);
      });

      pack.addEventListener("click", function () {
        if (fine.matches) return;
        var open = !pack.classList.contains("is-splayed");
        pack.classList.toggle("is-splayed", open);
        pack.setAttribute("aria-expanded", String(open));
        if (!open) clearSpread();
      });

      pack.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        e.preventDefault();
        if (!fine.matches) {
          pack.click();
          return;
        }
        if (pack.classList.contains("is-splayed") && pinned) {
          pinned = false;
          closeFan();
          return;
        }
        pinned = true;
        anchor = { x: last.x, y: last.y, card: cards[cards.length - 1], t: 0 };
        pack.classList.add("is-splayed");
        pack.setAttribute("aria-expanded", "true");
      });

      pack.addEventListener("blur", function () {
        if (!pinned) return;
        pinned = false;
        if (!nearCards(last.x, last.y, 48)) closeFan();
      });

      fine.addEventListener("change", function () {
        pinned = false;
        closeFan();
      });
    })();
  </script>
</body>
</html>
