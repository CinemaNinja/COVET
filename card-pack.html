<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Covet — Card pack</title>
  <!--
    Card pack study for the Covet site. No build step.
    The pack itself lives in card-pack.css and card-pack.js, which the home
    page shares. This page only adds a plain backdrop and a heading.
  -->
  <link rel="stylesheet" href="/card-pack.css?v=1">
  <style>
    :root {
      --ink: #14110e;
      --tide: #0c1418;
      --pearl: #f6f1e8;
      --gold: #d4af37;
      --serif: Didot, "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
      --sans: "Avenir Next", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background:
        radial-gradient(ellipse at 50% 18%, rgba(212, 175, 55, 0.16), transparent 42%),
        radial-gradient(ellipse at 50% 120%, rgba(20, 40, 48, 0.9), transparent 46%),
        var(--tide);
      color: var(--pearl);
      font-family: var(--sans);
      font-weight: 400;
      overflow-x: clip;
    }

    .scene {
      min-height: 100vh;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: clamp(1rem, 3vh, 1.8rem);
      padding: clamp(1.4rem, 4vh, 3rem) 4vw clamp(2rem, 6vh, 3.5rem);
    }

    .intro { text-align: center; }

    .kicker {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--gold);
    }

    h1 {
      margin: 0.35rem 0 0;
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 3.1rem);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .size {
      margin: 0.35rem 0 0;
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(246, 241, 232, 0.62);
    }

    .hint {
      margin: 0;
      max-width: 28rem;
      text-align: center;
      font-size: 0.92rem;
      line-height: 1.45;
      color: rgba(246, 241, 232, 0.78);
    }

    .flip-btn {
      appearance: none;
      border: 1px solid rgba(212, 175, 55, 0.7);
      background: transparent;
      color: var(--pearl);
      font: inherit;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.55rem 1.05rem;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
    }

    .flip-btn:hover,
    .flip-btn:focus-visible {
      border-color: var(--gold);
      color: var(--gold);
      background-color: rgba(212, 175, 55, 0.08);
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .flip-btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="scene" data-pack-stage>
    <header class="intro">
      <p class="kicker">Covet</p>
      <h1>Pack study</h1>
      <p class="size">2.75″ wide × 4.75″ tall</p>
    </header>

    <p class="hint">
      <span class="pack-for-hover">Hover the pack to fan it. Glide across the cards for a closer look.</span>
      <span class="pack-for-tap">Tap the pack to fan it. Slide across the cards for a closer look.</span>
    </p>

    <button class="flip-btn" type="button" data-pack-flip aria-pressed="false">Show the backs</button>

    <div class="pack" id="pack" data-card-pack role="button" tabindex="0" aria-expanded="false" aria-label="Card pack"></div>
  </main>

  <script src="/card-pack.js?v=1"></script>
</body>
</html>
